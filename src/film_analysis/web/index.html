<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Film analysis</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f1ea;
      --muted: #9c968c;
      --line: rgba(255, 255, 255, 0.1);
      --surface: #1c1c1e;
      --blue: #0a84ff;
      --gold: #ffd60a;
      --radius: 12px;
    }
    body {
      margin: 0;
      background: #111;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 46rem; margin: 3rem auto; padding: 0 1.25rem 3rem; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 650; letter-spacing: -0.03em; }
    h2 { margin: 2rem 0 0; font-size: 0.8rem; font-weight: 650; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
    a { color: inherit; }
    header nav { display: flex; align-items: center; gap: 0.35rem 1rem; }
    header nav a.quiet {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 650;
      text-decoration: none;
    }
    header nav a.quiet:hover,
    header nav a.quiet[aria-current="page"] { color: var(--ink); }
    #new-analysis {
      display: inline-flex;
      align-items: center;
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 650;
      letter-spacing: -0.01em;
      text-decoration: none;
    }
    #new-analysis:hover { background: #409cff; color: #fff; }
    #new-analysis:active { transform: scale(0.98); }
    p { color: var(--muted); }
    form { display: grid; gap: 0.75rem; margin-top: 0.85rem; }
    .lead { margin: 0.35rem 0 0; }
    form > label:not(.drop) { font-size: 0.8rem; color: var(--muted); }
    .drop {
      display: grid;
      place-items: center;
      min-height: 8.5rem;
      padding: 1rem;
      border: 1px dashed rgba(255, 255, 255, 0.22);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .drop.over {
      border-color: var(--blue);
      border-style: solid;
      box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.28);
    }
    .drop input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .or {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.75rem;
      margin: 0.15rem 0 0;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .or::before, .or::after { content: ""; height: 1px; background: var(--line); }
    input[type="url"] {
      box-sizing: border-box;
      width: 100%;
      padding: 0.65rem 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      background: var(--surface);
      color: inherit;
      font: inherit;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input[type="url"]:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.28);
    }
    button {
      width: fit-content;
      padding: 0.65rem 1.05rem;
      border: 0;
      border-radius: 10px;
      background: var(--ink);
      color: #111;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    button:hover:not(:disabled) { filter: brightness(1.06); }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.55; cursor: wait; }
    button.retry {
      padding: 0;
      background: transparent;
      color: var(--blue);
      font-size: 0.75rem;
      font-weight: 650;
    }
    button.retry:hover:not(:disabled) { filter: none; color: #409cff; }
    #status { margin: 0.85rem 0 0; color: var(--ink); font-weight: 650; }
    #status:empty { display: none; }
    #status.error { color: #ff9b90; }
    #projects, #results { margin: 0.35rem 0 0; padding: 0; list-style: none; }
    #projects {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
      gap: 0.45rem;
      margin-top: 0.7rem;
    }
    #projects a {
      position: relative;
      display: grid;
      grid-template-columns: 6rem minmax(0, 1fr);
      gap: 0.75rem;
      align-items: center;
      padding: 0.5rem;
      border-radius: 10px;
      background: var(--surface);
      text-decoration: none;
      transition: background 0.15s ease;
    }
    #projects a:hover { background: #242426; }
    #projects img, #projects .blank {
      display: block;
      width: 6rem;
      height: 3.4rem;
      object-fit: cover;
      border-radius: 6px;
      background: #000;
    }
    #projects .copy {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-width: 0;
    }
    #projects .title {
      margin: 0;
      color: var(--ink);
      font-size: 0.82rem;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    #projects .meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
    }
    #projects .plays {
      display: flex;
      align-items: baseline;
      gap: 0.28rem;
      margin: 0;
      color: var(--ink);
    }
    #projects .plays strong {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }
    #projects .plays span {
      color: #d9d3c8;
      font-size: 0.82rem;
      font-weight: 650;
    }
    #projects .plays.progress strong { color: var(--gold); }
    #projects .when {
      margin: 0;
      color: var(--muted);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }
    .pie {
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 50%;
      background: conic-gradient(from -90deg, var(--gold) var(--pct, 0%), #2c2c2e 0);
      flex: none;
    }
    #projects .pie {
      position: absolute;
      top: 0.4rem;
      left: 5.15rem;
      width: 1.05rem;
      height: 1.05rem;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.55);
    }
    #activity-list { margin: 0.7rem 0 0; padding: 0; list-style: none; display: grid; gap: 0.45rem; }
    #activity-list a {
      display: grid;
      gap: 0.28rem;
      padding: 0.75rem 0.85rem;
      border-radius: 10px;
      background: var(--surface);
      text-decoration: none;
    }
    #activity-list a:hover { background: #242426; }
    #activity-list .title {
      margin: 0;
      color: var(--ink);
      font-size: 0.92rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    #activity-list .step { margin: 0; color: var(--gold); font-size: 0.95rem; font-weight: 700; }
    #activity-list .step.stopped { color: #ff9b90; }
    #activity-list .detail { margin: 0; color: #d9d3c8; font-size: 0.85rem; }
    #activity-list .bar {
      height: 4px;
      border-radius: 999px;
      background: #2c2c2e;
      overflow: hidden;
    }
    #activity-list .bar div { height: 100%; width: 0; background: var(--gold); }
    #activity-list .bar.stopped div { background: #ff9b90; }
    #review h2 { margin-top: 1.35rem; }
    .pie.unknown {
      background: conic-gradient(from -90deg, var(--gold) 0 28%, #2c2c2e 0);
      animation: spin 0.9s linear infinite;
    }
    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr));
      gap: 0.7rem;
      margin-top: 0.7rem;
    }
    #results .play-card {
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      background: var(--surface);
    }
    #results .play-card.playing { box-shadow: 0 0 0 2px var(--gold); }
    #results video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      margin: 0;
      background: #000;
      object-fit: cover;
    }
    #results .play-badge {
      position: absolute;
      top: 0.45rem;
      left: 0.45rem;
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.72);
      color: var(--ink);
      font-size: 0.75rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }
    #results .play-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      margin: 0;
      padding: 0.55rem 0.7rem 0.65rem;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    #results .play-length { color: var(--muted); font-size: 0.8rem; }
    #film-thumb {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: var(--radius);
      background: #000;
      margin-top: 0.85rem;
    }
    #project-name { color: var(--ink); margin: 0.85rem 0 0.2rem; letter-spacing: -0.02em; }
    #film-meta { margin: 0; }
    #film-url {
      margin: 0.28rem 0 0;
      color: var(--muted);
      font-size: 0.85rem;
      text-decoration: none;
      overflow-wrap: anywhere;
      user-select: all;
      cursor: copy;
    }
    #film-url:not([hidden]) { display: block; }
    #film-url:hover { color: var(--ink); }
    #meter {
      display: grid;
      gap: 0.5rem;
      margin-top: 0.95rem;
    }
    #download-label {
      margin: 0;
      color: var(--ink);
      font-weight: 650;
    }
    #download-track {
      height: 0.3rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    #download-fill {
      position: relative;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--gold);
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #download-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.4), transparent 70%);
    }
    #download-track.unknown #download-fill {
      width: 38%;
      animation: download-slide 1.15s ease-in-out infinite;
    }
    #download-figures {
      display: flex;
      align-items: baseline;
      gap: 0.55rem;
      margin: 0;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    #download-pct {
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.04em;
    }
    #download-bytes { font-size: 0.95rem; color: var(--muted); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes download-slide {
      from { transform: translateX(-130%); }
      to { transform: translateX(290%); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Film analysis</h1>
      <nav>
        <a class="quiet" href="/analyses">My analyses</a>
        <a class="quiet" href="/activity">Activity</a>
        <a id="new-analysis" href="/">New analysis</a>
      </nav>
    </header>
    <p id="status" role="status"></p>
    <section id="composer">
      <section>
        <h2>New analysis</h2>
        <p class="lead">Paste a YouTube link or drop a video. Plays show up as the film is read.</p>
      <form id="upload">
        <label class="drop" id="drop" for="video">
          <input id="video" name="video" type="file" accept="video/*">
          <span id="drop-label">Drop a video here</span>
        </label>
        <p class="or">or</p>
        <label for="youtube">YouTube link</label>
        <input id="youtube" name="youtube" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
        <button type="submit">Analyze</button>
      </form>
      </section>
    </section>
    <section id="history" hidden>
      <h2>My analyses</h2>
      <p id="empty" class="lead" hidden>No films yet.</p>
      <ul id="projects"></ul>
    </section>
    <section id="activity" hidden>
      <h2>Activity</h2>
      <p id="activity-lead" class="lead">The server is idle.</p>
      <ul id="activity-list"></ul>
    </section>
    <section id="review" hidden>
      <img id="film-thumb" alt="" hidden>
      <div id="meter" hidden>
        <p id="download-label"></p>
        <div id="download-track" role="progressbar" aria-valuemin="0" aria-valuemax="100">
          <div id="download-fill"></div>
        </div>
        <p id="download-figures">
          <span id="download-pct" hidden></span>
          <span id="download-bytes"></span>
        </p>
      </div>
      <button id="retry" class="retry" type="button" hidden>Retry download</button>
      <p id="project-name"></p>
      <p id="film-meta"></p>
      <a id="film-url" hidden></a>
      <h2 id="plays-heading" hidden>Plays</h2>
      <ul id="results"></ul>
    </section>
  </main>
  <script>
    const form = document.querySelector("#upload");
    const status = document.querySelector("#status");
    const results = document.querySelector("#results");
    const playsHeading = document.querySelector("#plays-heading");
    const button = form.querySelector("button");
    const composer = document.querySelector("#composer");
    const review = document.querySelector("#review");
    const historySection = document.querySelector("#history");
    const activitySection = document.querySelector("#activity");
    const activityList = document.querySelector("#activity-list");
    const activityLead = document.querySelector("#activity-lead");
    const projectList = document.querySelector("#projects");
    const projectName = document.querySelector("#project-name");
    const filmThumb = document.querySelector("#film-thumb");
    const filmMeta = document.querySelector("#film-meta");
    const filmUrl = document.querySelector("#film-url");
    const meter = document.querySelector("#meter");
    const downloadLabel = document.querySelector("#download-label");
    const downloadTrack = document.querySelector("#download-track");
    const downloadFill = document.querySelector("#download-fill");
    const downloadPct = document.querySelector("#download-pct");
    const downloadBytes = document.querySelector("#download-bytes");
    const retryButton = document.querySelector("#retry");
    const fileInput = document.querySelector("#video");
    const youtubeInput = document.querySelector("#youtube");
    const drop = document.querySelector("#drop");
    const dropLabel = document.querySelector("#drop-label");
    let watch = 0;

    document.querySelector("header").addEventListener("click", (event) => {
      const link = event.target.closest("a");
      if (!link) return;
      event.preventDefault();
      const href = link.getAttribute("href") || "/";
      if (location.pathname !== href) history.pushState({}, "", href);
      watch += 1;
      form.reset();
      dropLabel.textContent = "Drop a video here";
      status.className = "";
      status.textContent = "";
      route();
    });

    drop.addEventListener("dragover", (event) => {
      event.preventDefault();
      drop.classList.add("over");
    });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", (event) => {
      event.preventDefault();
      drop.classList.remove("over");
      const file = event.dataTransfer.files[0];
      if (!file) return;
      const transfer = new DataTransfer();
      transfer.items.add(file);
      fileInput.files = transfer.files;
      dropLabel.textContent = file.name;
    });
    retryButton.addEventListener("click", () => {
      const id = results.dataset.project;
      if (id) retryDownload(id, retryButton);
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      dropLabel.textContent = file ? file.name : "Drop a video here";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const hasFile = fileInput.files.length > 0;
      const link = youtubeInput.value.trim();
      status.className = "";
      if (hasFile && link) {
        status.className = "error";
        status.textContent = "Use a file or a YouTube link.";
        return;
      }
      if (!hasFile && !link) {
        status.className = "error";
        status.textContent = "Upload a video or paste a YouTube link.";
        return;
      }
      const body = hasFile ? new FormData(form) : new URLSearchParams({ youtube: link });
      status.textContent = "Starting…";
      button.disabled = true;
      try {
        const response = await fetch("/analyze", { method: "POST", body });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          const detail = payload.detail;
          throw new Error(typeof detail === "string" ? detail : "Analysis failed.");
        }
        history.pushState({}, "", `/projects/${payload.project}`);
        showReview(payload);
      } catch (error) {
        status.className = "error";
        const offline = error.message === "Failed to fetch";
        status.textContent = offline
          ? "Couldn't reach the server. Run uv run film-analysis, then reload this page."
          : (error.message || "Analysis failed.");
      } finally {
        button.disabled = false;
      }
    });

    window.addEventListener("popstate", () => { route(); });
    route();

    async function route() {
      const match = location.pathname.match(/^\/projects\/(\d+)$/);
      if (!match) {
        if (location.pathname === "/analyses") await showAnalyses();
        else if (location.pathname === "/activity") await showActivity();
        else await showComposer();
        return;
      }
      const response = await fetch(`/api/projects/${match[1]}`);
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        status.className = "error";
        status.textContent = typeof payload.detail === "string"
          ? payload.detail
          : "That analysis is no longer available.";
        history.replaceState({}, "", "/");
        await showComposer();
        return;
      }
      showReview(payload);
    }

    async function follow(token, id) {
      const response = await fetch(`/api/projects/${id}`);
      if (token !== watch) return;
      const payload = await response.json().catch(() => ({}));
      if (token !== watch) return;
      if (!response.ok) {
        status.className = "error";
        status.textContent = typeof payload.detail === "string"
          ? payload.detail
          : "That analysis is no longer available.";
        return;
      }
      paint(payload, token);
    }

    async function showComposer() {
      ++watch;
      composer.hidden = false;
      historySection.hidden = true;
      activitySection.hidden = true;
      review.hidden = true;
      results.replaceChildren();
      delete results.dataset.project;
      markCurrent();
    }

    async function showAnalyses() {
      const token = ++watch;
      composer.hidden = true;
      historySection.hidden = false;
      activitySection.hidden = true;
      review.hidden = true;
      results.replaceChildren();
      delete results.dataset.project;
      markCurrent();
      await paintHistory(token);
    }

    async function showActivity() {
      const token = ++watch;
      composer.hidden = true;
      historySection.hidden = true;
      activitySection.hidden = false;
      review.hidden = true;
      results.replaceChildren();
      delete results.dataset.project;
      markCurrent();
      await paintActivity(token);
    }

    function markCurrent() {
      for (const link of document.querySelectorAll("header nav a")) {
        const href = link.getAttribute("href");
        if (href && href === location.pathname) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      }
    }

    async function paintHistory(token) {
      const response = await fetch("/api/projects");
      if (token !== watch) return;
      const projects = await response.json().catch(() => []);
      if (token !== watch) return;
      if (!Array.isArray(projects)) return;
      const empty = projects.length === 0;
      document.querySelector("#empty").hidden = !empty;
      projectList.hidden = empty;
      const links = [...projectList.querySelectorAll("a")];
      const same = links.length === projects.length
        && projects.every((project, index) => links[index].dataset.id === String(project.project));
      if (!same) {
        projectList.replaceChildren();
        for (const project of projects) projectList.append(historyItem(project));
      } else {
        projects.forEach((project, index) => fillHistoryLink(links[index], project));
      }
      if (projects.some((project) => project.status === "downloading")) {
        window.setTimeout(() => {
          if (token === watch && !historySection.hidden) paintHistory(token);
        }, 1000);
      }
    }

    async function paintActivity(token) {
      const response = await fetch("/api/activity");
      if (token !== watch) return;
      const payload = await response.json().catch(() => ({}));
      if (token !== watch) return;
      if (!response.ok) {
        status.className = "error";
        status.textContent = typeof payload.detail === "string"
          ? payload.detail
          : "Couldn't read server activity.";
        return;
      }
      const jobs = Array.isArray(payload.jobs) ? payload.jobs : [];
      const running = jobs.filter((job) => job.running).length;
      const stopped = jobs.length - running;
      if (!jobs.length) activityLead.textContent = "The server is idle.";
      else if (!running) activityLead.textContent = stopped === 1 ? "1 stopped." : `${stopped} stopped.`;
      else if (!stopped) activityLead.textContent = running === 1 ? "1 running." : `${running} running.`;
      else activityLead.textContent = `${running} running. ${stopped} stopped.`;
      const links = [...activityList.querySelectorAll("a")];
      const same = links.length === jobs.length
        && jobs.every((job, index) => links[index].dataset.id === String(job.project));
      if (!same) {
        activityList.replaceChildren();
        for (const job of jobs) activityList.append(activityItem(job));
      } else {
        jobs.forEach((job, index) => fillActivity(links[index], job));
      }
      window.setTimeout(() => {
        if (token === watch && !activitySection.hidden) paintActivity(token);
      }, 1000);
    }

    function activityItem(job) {
      const item = document.createElement("li");
      const link = document.createElement("a");
      link.dataset.id = String(job.project);
      link.href = `/projects/${job.project}`;
      link.addEventListener("click", (event) => {
        event.preventDefault();
        history.pushState({}, "", link.href);
        route();
      });
      const title = document.createElement("p");
      title.className = "title";
      const step = document.createElement("p");
      step.className = "step";
      const detail = document.createElement("p");
      detail.className = "detail";
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.append(document.createElement("div"));
      link.append(title, step, detail, bar);
      fillActivity(link, job);
      item.append(link);
      return item;
    }

    function fillActivity(link, job) {
      link.querySelector(".title").textContent = job.name;
      const step = link.querySelector(".step");
      step.textContent = activityStep(job);
      step.classList.toggle("stopped", !job.running);
      link.querySelector(".detail").textContent = activityDetail(job);
      const bar = link.querySelector(".bar");
      const percent = activityPercent(job);
      bar.classList.toggle("stopped", !job.running);
      bar.hidden = percent == null;
      bar.querySelector("div").style.width = percent == null ? "" : `${percent}%`;
    }

    function activityStep(job) {
      if (!job.running) return "Stopped";
      if (job.phase === "scanning") return "Reading";
      if (job.phase === "saving") return "Saving";
      if (job.phase === "starting") return "Starting";
      return "Downloading";
    }

    function activityDetail(job) {
      if (!job.running) {
        const last = job.status === "scanning" ? "reading" : "downloading";
        const progress = activityProgress(job);
        return progress ? `Stopped while ${last} · ${progress}` : `Stopped while ${last}`;
      }
      if (job.phase === "starting") return "Getting ready";
      if (job.phase === "saving") return "Saving the film";
      if (job.phase === "scanning") {
        const done = clock(job.scanned || 0);
        const plays = `${job.play_count} ${job.play_count === 1 ? "play" : "plays"}`;
        const read = job.duration ? `Read ${done} of ${clock(job.duration)}` : `Read ${done}`;
        return `${read} · ${plays}`;
      }
      return activityProgress(job) || "Connecting to the video…";
    }

    function activityProgress(job) {
      if (job.status === "scanning" || job.phase === "scanning") {
        const total = Number(job.duration) || 0;
        if (total <= 0) return "";
        return `${Math.min(100, Math.round(((Number(job.scanned) || 0) / total) * 100))}%`;
      }
      const total = Number(job.total_bytes) || 0;
      const done = Number(job.downloaded) || 0;
      if (total <= 0) return done > 0 ? `${megabytes(done)} downloaded` : "";
      const percent = Math.min(100, Math.round((done / total) * 100));
      return `${percent}% · ${megabytes(done)} of ${megabytes(total)}`;
    }

    function activityPercent(job) {
      if (job.phase === "scanning" || (job.status === "scanning" && !job.running)) {
        const total = Number(job.duration) || 0;
        if (total <= 0) return null;
        return Math.min(100, Math.round(((Number(job.scanned) || 0) / total) * 100));
      }
      if (job.phase === "saving") return 100;
      const total = Number(job.total_bytes) || 0;
      if (total <= 0) return null;
      return Math.min(100, Math.round(((Number(job.downloaded) || 0) / total) * 100));
    }

    function historyItem(project) {
      const item = document.createElement("li");
      const link = document.createElement("a");
      link.dataset.id = String(project.project);
      link.href = `/projects/${project.project}`;
      link.addEventListener("click", (event) => {
        event.preventDefault();
        history.pushState({}, "", link.href);
        route();
      });
      fillHistoryLink(link, project);
      item.append(link);
      return item;
    }

    function fillHistoryLink(link, project) {
      let thumb = link.querySelector("img, .blank");
      if (project.thumbnail) {
        if (!thumb || thumb.tagName !== "IMG") {
          thumb?.remove();
          thumb = document.createElement("img");
          thumb.alt = "";
          link.prepend(thumb);
        }
        if (thumb.getAttribute("src") !== project.thumbnail) thumb.src = project.thumbnail;
      } else if (!thumb || !thumb.classList.contains("blank")) {
        thumb?.remove();
        thumb = document.createElement("span");
        thumb.className = "blank";
        link.prepend(thumb);
      }
      let copy = link.querySelector(".copy");
      if (!copy) {
        copy = document.createElement("span");
        copy.className = "copy";
        const title = document.createElement("p");
        title.className = "title";
        const meta = document.createElement("span");
        meta.className = "meta";
        const plays = document.createElement("p");
        plays.className = "plays";
        plays.append(document.createElement("strong"), document.createElement("span"));
        const when = document.createElement("p");
        when.className = "when";
        meta.append(plays, when);
        copy.append(title, meta);
        link.append(copy);
      }
      copy.querySelector(".title").textContent = project.name;
      const plays = copy.querySelector(".plays");
      const strong = plays.querySelector("strong");
      const label = plays.querySelector("span");
      const percent = downloadPercent(project);
      const showingProgress = project.status === "downloading" && !project.play_count && percent != null;
      plays.classList.toggle("progress", showingProgress);
      if (project.status === "downloading" && !project.play_count) {
        strong.hidden = percent == null;
        strong.textContent = percent == null ? "" : `${percent}%`;
        label.textContent = percent == null ? "Downloading" : "downloaded";
      } else {
        strong.hidden = false;
        strong.textContent = String(project.play_count);
        label.textContent = project.play_count === 1 ? "play" : "plays";
      }
      const when = copy.querySelector(".when");
      const retry = ensureRetry(link);
      const waiting = canRetry(project);
      when.hidden = waiting;
      retry.hidden = !waiting;
      if (!waiting) when.textContent = whenLabel(project.created);
      const next = downloadPieFor(project);
      const current = link.querySelector(".pie");
      if (!next) {
        current?.remove();
      } else if (!current) {
        link.append(next);
      } else if (next.classList.contains("unknown")) {
        current.classList.add("unknown");
        current.style.removeProperty("--pct");
        current.setAttribute("aria-label", "Downloading");
      } else {
        current.classList.remove("unknown");
        current.style.setProperty("--pct", next.style.getPropertyValue("--pct"));
        current.setAttribute("aria-label", next.getAttribute("aria-label"));
      }
    }

    function canRetry(project) {
      const linked = Boolean(project.youtube_url || project.youtube);
      const waiting = project.status === "downloading" || project.status === "failed";
      return linked && waiting && !project.running;
    }

    function ensureRetry(link) {
      let retry = link.querySelector(".retry");
      if (retry) return retry;
      retry = document.createElement("button");
      retry.type = "button";
      retry.className = "retry";
      retry.textContent = "Retry";
      retry.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        retryDownload(link.dataset.id, retry);
      });
      link.querySelector(".meta").append(retry);
      return retry;
    }

    async function retryDownload(id, button) {
      button.disabled = true;
      try {
        const response = await fetch(`/api/projects/${id}/retry`, { method: "POST" });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          status.className = "error";
          status.textContent = typeof payload.detail === "string"
            ? payload.detail
            : "Could not retry that download.";
          return;
        }
        if (location.pathname === `/projects/${id}`) showReview(payload);
        else if (!historySection.hidden) paintHistory(watch);
      } finally {
        button.disabled = false;
      }
    }

    function whenLabel(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      const now = new Date();
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const day = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const diff = Math.round((start - day) / 86400000);
      if (diff === 0) return "Today";
      if (diff === 1) return "Yesterday";
      const options = { month: "short", day: "numeric" };
      if (date.getFullYear() !== now.getFullYear()) options.year = "numeric";
      return date.toLocaleDateString(undefined, options);
    }

    function downloadPercent(project) {
      if (project.status !== "downloading") return null;
      const total = Number(project.total_bytes) || 0;
      if (total <= 0) return null;
      const done = Number(project.downloaded) || 0;
      return Math.min(100, Math.round((done / total) * 100));
    }

    function downloadPieFor(project) {
      if (project.status !== "downloading") return null;
      return pie(downloadPercent(project));
    }

    function pie(percent) {
      const node = document.createElement("span");
      node.className = "pie";
      node.setAttribute("role", "img");
      if (percent == null) {
        node.classList.add("unknown");
        node.setAttribute("aria-label", "Downloading");
        return node;
      }
      node.style.setProperty("--pct", `${percent}%`);
      node.setAttribute("aria-label", `${percent}% downloaded`);
      return node;
    }

    function showReview(project) {
      paint(project, ++watch);
    }

    function paint(project, token) {
      composer.hidden = true;
      historySection.hidden = true;
      activitySection.hidden = true;
      review.hidden = false;
      markCurrent();
      if (results.dataset.project !== String(project.project)) {
        results.replaceChildren();
        results.dataset.project = String(project.project);
      }
      projectName.textContent = project.name;
      if (project.thumbnail && filmThumb.dataset.source !== project.thumbnail) {
        filmThumb.dataset.source = project.thumbnail;
        filmThumb.src = project.thumbnail;
        filmThumb.alt = project.name || "Film";
      }
      filmThumb.hidden = !project.thumbnail;
      const meta = [];
      if (project.channel) meta.push(project.channel);
      if (project.duration) meta.push(clock(project.duration));
      filmMeta.textContent = meta.join(" · ");
      paintUrl(project.youtube_url || "");
      const active = project.status === "downloading" || project.status === "scanning";
      meter.hidden = !active;
      retryButton.hidden = !canRetry(project);
      if (project.status === "downloading") paintDownload(project);
      if (project.status === "scanning") paintScan(project);
      const plays = project.plays || [];
      playsHeading.hidden = plays.length === 0;
      const seen = new Set(plays.map((play) => String(play.play_number)));
      for (const play of plays) {
        if (results.querySelector(`li[data-play="${play.play_number}"]`)) continue;
        results.append(playCard(play));
      }
      for (const item of [...results.children]) {
        if (!seen.has(item.dataset.play)) item.remove();
      }
      const running = project.status === "downloading" || project.status === "scanning";
      status.className = project.status === "failed" ? "error" : "";
      status.textContent = progressText(project, plays.length);
      if (running) window.setTimeout(() => follow(token, project.project), 1000);
    }

    results.addEventListener("play", (event) => {
      const video = event.target;
      if (!(video instanceof HTMLVideoElement)) return;
      for (const other of results.querySelectorAll("video")) {
        if (other !== video) other.pause();
      }
      for (const card of results.querySelectorAll(".play-card")) {
        card.classList.toggle("playing", card.contains(video));
      }
    }, true);

    function playCard(play) {
      const item = document.createElement("li");
      item.className = "play-card";
      item.dataset.play = String(play.play_number);
      const badge = document.createElement("span");
      badge.className = "play-badge";
      badge.textContent = String(play.play_number);
      const meta = document.createElement("p");
      meta.className = "play-meta";
      const range = document.createElement("span");
      range.textContent = `${clock(play.start)} – ${clock(play.end)}`;
      const length = document.createElement("span");
      length.className = "play-length";
      length.textContent = playLength(play.end - play.start);
      meta.append(range, length);
      if (play.video) {
        const video = document.createElement("video");
        video.controls = true;
        video.preload = "metadata";
        video.playsInline = true;
        video.src = play.video;
        item.append(video);
      }
      item.append(badge, meta);
      return item;
    }

    function playLength(seconds) {
      const whole = Math.max(1, Math.round(Math.abs(seconds)));
      if (whole < 60) return `${whole}s`;
      return clock(whole);
    }

    filmThumb.addEventListener("load", () => useSharperThumbnail(false));
    filmThumb.addEventListener("error", () => useSharperThumbnail(true));

    function useSharperThumbnail(failed) {
      const src = filmThumb.src;
      if (!failed && filmThumb.naturalWidth >= 640) return;
      const next = src.includes("/maxresdefault.")
        ? src.replace("/maxresdefault.", "/sddefault.")
        : src.includes("/sddefault.")
          ? src.replace("/sddefault.", "/hqdefault.")
          : "";
      if (next && next !== src) filmThumb.src = next;
    }

    filmUrl.addEventListener("click", async (event) => {
      event.preventDefault();
      const url = filmUrl.dataset.url;
      if (!url) return;
      try {
        await navigator.clipboard.writeText(url);
      } catch {
        return;
      }
      filmUrl.dataset.copied = "1";
      filmUrl.textContent = "Copied";
      window.setTimeout(() => {
        delete filmUrl.dataset.copied;
        if (filmUrl.dataset.url) filmUrl.textContent = filmUrl.dataset.url;
      }, 1200);
    });

    function paintUrl(url) {
      filmUrl.hidden = !url;
      if (filmUrl.dataset.url === url) return;
      filmUrl.dataset.url = url;
      filmUrl.href = url || "#";
      if (!filmUrl.dataset.copied) filmUrl.textContent = url;
    }

    function paintDownload(project) {
      const done = Number(project.downloaded) || 0;
      const total = Number(project.total_bytes) || 0;
      if (total > 0) {
        const pct = Math.min(100, Math.round((done / total) * 100));
        setMeter(pct, "Downloading", `${megabytes(done)} of ${megabytes(total)}`);
        return;
      }
      setMeter(
        null,
        "Downloading the film",
        done > 0 ? `${megabytes(done)} downloaded` : "Connecting to the video…",
      );
    }

    function paintScan(project) {
      const done = Number(project.scanned) || 0;
      const total = Number(project.duration) || 0;
      if (total > 0) {
        const pct = Math.min(100, Math.round((done / total) * 100));
        setMeter(pct, "Reading the film", `Read ${clock(done)} of ${clock(total)}`);
        return;
      }
      setMeter(null, "Reading the film", `Read ${clock(done)}`);
    }

    function setMeter(percent, title, detail) {
      downloadLabel.textContent = title;
      downloadBytes.textContent = detail;
      if (percent == null) {
        downloadTrack.classList.add("unknown");
        downloadTrack.removeAttribute("aria-valuenow");
        downloadFill.style.width = "";
        downloadPct.hidden = true;
        downloadPct.textContent = "";
        return;
      }
      downloadTrack.classList.remove("unknown");
      downloadTrack.setAttribute("aria-valuenow", String(percent));
      downloadTrack.setAttribute("aria-valuetext", `${percent}%, ${detail}`);
      downloadFill.style.width = `${percent}%`;
      downloadPct.hidden = false;
      downloadPct.textContent = `${percent}%`;
    }

    function megabytes(bytes) {
      const mb = bytes / (1024 * 1024);
      if (mb >= 100) return `${Math.round(mb)} MB`;
      if (mb >= 10) return `${Math.round(mb)} MB`;
      return `${mb.toFixed(1)} MB`;
    }

    function progressText(project, count) {
      if (project.status === "downloading") return "";
      if (project.status === "scanning") {
        const done = clock(project.scanned || 0);
        return project.duration ? `Scanning ${done} of ${clock(project.duration)}` : `Scanning ${done}`;
      }
      if (project.status === "failed") return project.error || "Could not read that film.";
      if (!count) return "No plays found.";
      return "";
    }

    function clock(seconds) {
      const whole = Math.max(0, Math.round(seconds));
      const hours = Math.floor(whole / 3600);
      const minutes = Math.floor((whole % 3600) / 60);
      const secs = whole % 60;
      if (hours) return `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      return `${minutes}:${String(secs).padStart(2, "0")}`;
    }
  </script>
</body>
