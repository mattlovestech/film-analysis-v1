<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analyze</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font: 16px/1.4 "Avenir Next", "Segoe UI", sans-serif; background: #f6f4ef; color: #1c1c1a; }
    header { display: flex; justify-content: space-between; gap: 1rem; align-items: center; padding: 1rem 1.25rem; }
    nav { display: flex; gap: 0.9rem; align-items: center; }
    a { color: inherit; }
    a.quiet { color: #5c5a55; text-decoration: none; }
    h1 { font-size: 1.4rem; margin: 0; }
    main { padding: 0 1.25rem 2rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 0.7rem 0.75rem; border-bottom: 1px solid #ece8e0; vertical-align: middle; }
    th { font-size: 0.85rem; color: #5c5a55; font-weight: 600; }
    tr.play { cursor: pointer; }
    tr.play.open { background: #f3f7f1; }
    .bar { height: 0.45rem; background: #ece8e0; border-radius: 999px; overflow: hidden; min-width: 5.5rem; }
    .bar span { display: block; height: 100%; background: #2f6b3a; width: 0; }
    button { border: 0; border-radius: 999px; padding: 0.4rem 0.75rem; background: #1c1c1a; color: #fff; font: inherit; }
    button:disabled { opacity: 0.45; }
    #empty, .status { color: #5c5a55; }
    .panel { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.1fr); gap: 1rem; padding: 0.25rem 0 0.5rem; }
    video, canvas { width: 100%; border-radius: 8px; background: #111; }
    canvas { background: #e7f0df; }
    .workers { margin: 0.75rem 0 0.4rem; color: #5c5a55; }
    table.trace { margin-top: 0.25rem; }
    table.trace th, table.trace td { font-size: 0.92rem; }
    tr.step { cursor: pointer; }
    tr.step-detail { background: #f8f6f1; cursor: default; }
    tr.step-detail h3 { margin: 0.2rem 0; font-size: 0.85rem; }
    tr.step-detail dl { display: grid; grid-template-columns: 9rem 1fr; gap: 0.15rem 0.6rem; margin: 0 0 0.6rem; }
    tr.step-detail dt { color: #5c5a55; }
    tr.step-detail dd { margin: 0; }
    tr.step-detail img { max-width: 240px; margin: 0.3rem 0.4rem 0 0; border-radius: 6px; }
    table.call { margin-top: 0.4rem; background: #fff; }
    table.call th, table.call td { vertical-align: top; }
    table.call td:first-child { width: 6rem; color: #5c5a55; font-weight: 600; }
    table.call pre { margin: 0; white-space: pre-wrap; font: 0.85rem/1.4 ui-monospace, monospace; max-height: 16rem; overflow: auto; }
    .warn { color: #8a5a12; margin: 0.2rem 0; }
    @media (max-width: 800px) { .panel { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1><a href="/projects">Opponent scouting</a></h1>
    <nav>
      <a class="quiet" href="/projects">Projects</a>
      <a class="quiet" href="/analyze">Analyze</a>
      <a class="quiet" href="/activity">Activity</a>
      <a class="quiet" href="/settings">Settings</a>
    </nav>
  </header>
  <main>
    <p id="empty" hidden>No offense or defense plays are stored yet.</p>
    <p id="loading">Loading the offense and defense plays.</p>
    <table id="plays" hidden>
      <thead>
        <tr>
          <th>Film</th>
          <th>Play</th>
          <th>Clock</th>
          <th>Type</th>
          <th>Players</th>
          <th>Plot</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
  <script>
    const table = document.querySelector("#plays");
    const body = table.querySelector("tbody");
    const empty = document.querySelector("#empty");
    const loading = document.querySelector("#loading");
    let openUid = null;
    let listed = "";
    let refreshToken = 0;

    function bar(percent) {
      const cell = document.createElement("td");
      const track = document.createElement("div");
      track.className = "bar";
      track.setAttribute("role", "progressbar");
      track.setAttribute("aria-valuemin", "0");
      track.setAttribute("aria-valuemax", "100");
      track.setAttribute("aria-valuenow", String(percent));
      const fill = document.createElement("span");
      fill.style.width = `${percent}%`;
      track.append(fill);
      cell.append(track);
      return cell;
    }

    function setBar(cell, percent) {
      const track = cell.querySelector("[role=progressbar]");
      track.setAttribute("aria-valuenow", String(percent));
      track.querySelector("span").style.width = `${percent}%`;
    }

    function playRow(row) {
      const tr = document.createElement("tr");
      tr.className = "play";
      tr.dataset.uid = row.uid;
      const film = document.createElement("td");
      film.textContent = row.name;
      const play = document.createElement("td");
      play.textContent = String(row.play);
      const clock = document.createElement("td");
      clock.textContent = row.clock;
      const action = document.createElement("td");
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = row.running ? "Reading" : "Run";
      button.disabled = row.running;
      button.addEventListener("click", (event) => {
        event.stopPropagation();
        start(row.uid, button);
      });
      action.append(button);
      tr.append(film, play, clock, bar(row.type), bar(row.players), bar(row.plot), action);
      tr.dataset.running = row.running ? "1" : "";
      tr.addEventListener("click", () => toggle(row.uid));
      return tr;
    }

    function updateRow(tr, row) {
      tr.children[0].textContent = row.name;
      tr.children[1].textContent = String(row.play);
      tr.children[2].textContent = row.clock;
      setBar(tr.children[3], row.type);
      setBar(tr.children[4], row.players);
      setBar(tr.children[5], row.plot);
      const button = tr.querySelector("button");
      button.textContent = row.running ? "Reading" : "Run";
      button.disabled = row.running;
      tr.dataset.running = row.running ? "1" : "";
      tr.classList.toggle("open", row.uid === openUid);
    }

    function paint(rows) {
      loading.hidden = true;
      empty.hidden = rows.length > 0;
      table.hidden = rows.length === 0;
      const next = rows.map((row) => row.uid).join("\n");
      const plays = new Map([...body.querySelectorAll("tr.play")].map((tr) => [tr.dataset.uid, tr]));
      if (next === listed && plays.size === rows.length) {
        for (const row of rows) updateRow(plays.get(row.uid), row);
        return;
      }
      listed = next;
      const details = new Map([...body.querySelectorAll("tr.detail")].map((tr) => [tr.dataset.uid, tr]));
      const seen = new Set();
      for (const row of rows) {
        seen.add(row.uid);
        let tr = plays.get(row.uid);
        if (!tr) tr = playRow(row);
        else updateRow(tr, row);
        body.append(tr);
        const detail = details.get(row.uid);
        if (detail) body.append(detail);
      }
      for (const [uid, tr] of plays) {
        if (seen.has(uid)) continue;
        details.get(uid)?.remove();
        tr.remove();
      }
    }

    function toggle(uid) {
      const current = body.querySelector(`tr.detail[data-uid="${cssAttr(uid)}"]`);
      for (const open of [...body.querySelectorAll("tr.detail")]) {
        if (open !== current) open.remove();
      }
      for (const tr of body.querySelectorAll("tr.play")) tr.classList.remove("open");
      if (current) {
        current.remove();
        openUid = null;
        return;
      }
      openUid = uid;
      const play = body.querySelector(`tr.play[data-uid="${cssAttr(uid)}"]`);
      play.classList.add("open");
      const detail = document.createElement("tr");
      detail.className = "detail";
      detail.dataset.uid = uid;
      const cell = document.createElement("td");
      cell.colSpan = 7;
      const panel = document.createElement("div");
      panel.className = "panel";
      const side = document.createElement("div");
      const status = document.createElement("p");
      status.className = "status";
      status.textContent = "Loading this play.";
      const video = document.createElement("video");
      video.controls = true;
      video.playsInline = true;
      const parts = uid.split("-");
      video.src = `/projects/${parts[0]}/plays/${parts[1]}`;
      side.append(status, video);
      const canvas = document.createElement("canvas");
      canvas.width = 720;
      canvas.height = 520;
      canvas.title = "Open this diagram";
      canvas.addEventListener("click", () => {
        if (!detail._trace || !detail._trace.diagram) return;
        location.assign(`/analyze/play/${encodeURIComponent(uid)}`);
      });
      panel.append(side, canvas);
      const workers = document.createElement("p");
      workers.className = "workers";
      const trace = document.createElement("table");
      trace.className = "trace";
      const head = document.createElement("thead");
      const headings = document.createElement("tr");
      for (const label of ["Step", "Status", "AI", "In", "Out", "Time"]) {
        const th = document.createElement("th");
        th.textContent = label;
        headings.append(th);
      }
      head.append(headings);
      trace.append(head, document.createElement("tbody"));
      cell.append(panel, workers, trace);
      detail.append(cell);
      play.after(detail);
      if (play.dataset.running) watchPlay(uid);
      else refreshOpen();
    }

    const TRACE_STEPS = [
      ["load", "Load"],
      ["classify", "Classify"],
      ["frames", "Frames"],
      ["players", "Players"],
      ["model", "Model"],
      ["plot", "Plot"],
      ["save", "Save"],
    ];

    function brief(value) {
      if (!value || typeof value !== "object") return "";
      return Object.entries(value).map(([key, item]) => {
        if (item && typeof item === "object") {
          const text = item.hex || item.name || item.line || "";
          return text ? `${key} ${text}` : key;
        }
        if (item == null || item === "") return key;
        return `${key} ${item}`;
      }).join(" · ");
    }

    function workersLine(payload) {
      const pool = payload.workers || {};
      const busy = Number(pool.busy || 0);
      const size = Number(pool.workers || 0);
      const run = payload.run;
      const who = (run && run.worker) || "";
      let line = `One worker runs every step below. ${busy} of ${size} workers busy.`;
      if (run && (run.status === "queued" || run.status === "running")) {
        const step = (run.steps || []).find((item) => item.status === "running");
        const name = who || "A worker";
        line += step ? ` ${name} is on ${step.name}.` : ` ${name} has this play.`;
      } else if (who) {
        line += ` ${who} ran this play.`;
      }
      line += " Only the Model step calls an AI model.";
      return line;
    }

    function fieldList(title, value) {
      const box = document.createElement("div");
      const heading = document.createElement("h3");
      heading.textContent = title;
      box.append(heading);
      const entries = value && typeof value === "object" ? Object.entries(value) : [];
      if (!entries.length) {
        const empty = document.createElement("p");
        empty.textContent = "Nothing recorded.";
        box.append(empty);
        return box;
      }
      const list = document.createElement("dl");
      for (const [key, item] of entries) {
        const term = document.createElement("dt");
        term.textContent = key;
        const description = document.createElement("dd");
        description.textContent = item && typeof item === "object" ? JSON.stringify(item) : String(item ?? "");
        list.append(term, description);
      }
      box.append(list);
      return box;
    }

    function callTable(step, run) {
      const call = step && step.call;
      const wrap = document.createElement("div");
      const heading = document.createElement("h3");
      heading.textContent = "Call";
      wrap.append(heading);
      const table = document.createElement("table");
      table.className = "call";
      if (!call || call.sent === false) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 2;
        cell.textContent = call && call.reason
          ? `The model was not called. ${call.reason}`
          : "The model was not called.";
        row.append(cell);
        table.append(row);
        wrap.append(table);
        return wrap;
      }
      for (const [label, text] of [
        ["Model", call.model || ""],
        ["Frames", String(call.frames ?? 0)],
        ["Prompt", call.prompt || ""],
        ["Reply", call.reply || ""],
      ].concat(call.error ? [["Error", call.error]] : [])) {
        const row = document.createElement("tr");
        const name = document.createElement("td");
        name.textContent = label;
        const value = document.createElement("td");
        const body = document.createElement("pre");
        body.textContent = text;
        value.append(body);
        row.append(name, value);
        table.append(row);
      }
      wrap.append(table);
      if (run) {
        for (const image of call.images || []) {
          const picture = document.createElement("img");
          picture.alt = image;
          picture.src = `/api/diagram-test/runs/${encodeURIComponent(run.run_id)}/images/${encodeURIComponent(image)}`;
          wrap.append(picture);
        }
      }
      return wrap;
    }

    function paintTrace(detail, payload) {
      detail._trace = payload;
      const host = detail.querySelector(".trace");
      detail.querySelector(".workers").textContent = workersLine(payload);
      const openName = host.dataset.open || "";
      const byName = Object.fromEntries(((payload.run && payload.run.steps) || []).map((step) => [step.name, step]));
      const steps = host.querySelector("tbody");
      steps.replaceChildren();
      for (const [name, label] of TRACE_STEPS) {
        const step = byName[name];
        const row = document.createElement("tr");
        row.className = "step";
        for (const text of [
          label,
          step ? step.status : "—",
          name === "model" ? "Yes" : "No",
          brief(step && step.incoming),
          brief(step && step.data),
          step && step.ms != null ? `${step.ms} ms` : "—",
        ]) {
          const cell = document.createElement("td");
          cell.textContent = text;
          row.append(cell);
        }
        row.addEventListener("click", () => {
          host.dataset.open = host.dataset.open === name ? "" : name;
          paintTrace(detail, detail._trace);
        });
        steps.append(row);
        if (openName !== name) continue;
        const extra = document.createElement("tr");
        extra.className = "step-detail";
        const cell = document.createElement("td");
        cell.colSpan = 6;
        cell.append(fieldList("In", step && step.incoming), fieldList("Out", step && step.data));
        for (const warning of (step && step.warnings) || []) {
          const note = document.createElement("p");
          note.className = "warn";
          note.textContent = warning;
          cell.append(note);
        }
        if (name === "model") {
          cell.append(callTable(step, payload.run));
        } else {
          const note = document.createElement("p");
          note.textContent = "This step does not call a model. It runs on the same worker as the other steps.";
          cell.append(note);
        }
        const run = payload.run;
        if (run && step) {
          for (const image of step.artifacts || []) {
            const picture = document.createElement("img");
            picture.alt = image;
            picture.src = `/api/diagram-test/runs/${encodeURIComponent(run.run_id)}/images/${encodeURIComponent(image)}`;
            cell.append(picture);
          }
        }
        extra.append(cell);
        steps.append(extra);
      }
    }

    async function refreshOpen() {
      if (!openUid) return;
      const uid = openUid;
      const token = ++refreshToken;
      const detail = body.querySelector(`tr.detail[data-uid="${cssAttr(uid)}"]`);
      if (!detail) return;
      const response = await fetch(`/api/plays/${encodeURIComponent(uid)}/diagram`);
      if (!response.ok || token !== refreshToken || uid !== openUid) return;
      showPlay(detail, await response.json());
    }

    function showPlay(detail, payload) {
      const status = detail.querySelector(".status");
      paintTrace(detail, payload);
      if (!payload.diagram) {
        status.textContent = payload.running ? "Reading this play." : "Run this play to place the players.";
        return;
      }
      const teams = payload.diagram.teams || {};
      status.textContent = `${teams.offense || "Offense"} on offense, ${teams.defense || "defense"} on defense.`;
      draw(detail.querySelector("canvas"), payload.diagram);
    }

    async function start(uid, button) {
      button.disabled = true;
      button.textContent = "Reading";
      const row = body.querySelector(`tr.play[data-uid="${cssAttr(uid)}"]`);
      if (row) row.dataset.running = "1";
      await fetch(`/api/plays/${encodeURIComponent(uid)}/diagram`, { method: "POST" });
      watchPlay(uid);
    }

    function draw(canvas, diagram) {
      const ctx = canvas.getContext("2d");
      const width = canvas.width;
      const height = canvas.height;
      const left = 48;
      const right = width - 20;
      const top = 28;
      const bottom = height - 28;
      const field = diagram.field || {};
      const xMax = Number(field.width || 53.3) / 2;
      const people = [...(diagram.offense || []), ...(diagram.defense || [])];
      let yMin = -12;
      let yMax = 12;
      for (const player of people) {
        const y = Number(player.y) || 0;
        yMin = Math.min(yMin, y);
        yMax = Math.max(yMax, y);
      }
      const pad = Math.max(2, (yMax - yMin) * 0.08);
      yMin -= pad;
      yMax += pad;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#e7f0df";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "#b7c7ae";
      ctx.fillStyle = "#5d6b58";
      ctx.font = "13px sans-serif";
      ctx.lineWidth = 1;
      const startYard = Math.ceil(yMin / 5) * 5;
      const endYard = Math.floor(yMax / 5) * 5;
      for (let yard = startYard; yard <= endYard; yard += 5) {
        const y = mapY(yard);
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(right, y);
        ctx.stroke();
        ctx.fillText(String(50 - yard), 6, y + 4);
      }
      ctx.strokeStyle = "#1c1c1a";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(left, mapY(0));
      ctx.lineTo(right, mapY(0));
      ctx.stroke();
      ctx.fillStyle = "#1c1c1a";
      ctx.fillText("goal", right - 40, 18);
      const offenseColor = "#1d4ed8";
      const defenseColor = "#dc2626";
      const center = centerOnBall(diagram.offense || []);
      paintSide(diagram.offense || [], offenseColor, center);
      paintSide(diagram.defense || [], defenseColor, null);
      paintKey(offenseColor, defenseColor);

      function mapX(x) {
        return left + ((Number(x) + xMax) / (xMax * 2)) * (right - left);
      }
      function mapY(y) {
        return bottom - ((y - yMin) / (yMax - yMin)) * (bottom - top);
      }
      function centerOnBall(players) {
        let best = null;
        let bestScore = Infinity;
        for (const player of players) {
          if (player.role !== "center" && player.symbol !== "square") continue;
          const score = Math.abs(Number(player.y) || 0) * 2 + Math.abs(Number(player.x) || 0);
          if (score < bestScore) {
            best = player;
            bestScore = score;
          }
        }
        return best;
      }
      function paintSide(players, fill, squarePlayer) {
        for (const player of players) {
          const x = mapX(player.x);
          const y = mapY(Number(player.y) || 0);
          ctx.beginPath();
          ctx.lineWidth = 2;
          ctx.strokeStyle = fill;
          ctx.fillStyle = player.seen === false ? "transparent" : fill;
          if (player === squarePlayer) ctx.rect(x - 8, y - 8, 16, 16);
          else ctx.arc(x, y, 8, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }
      }
      function paintKey(offense, defense) {
        ctx.font = "13px sans-serif";
        ctx.fillStyle = offense;
        ctx.fillRect(left, height - 22, 12, 12);
        ctx.fillStyle = "#1c1c1a";
        ctx.fillText("Offense", left + 16, height - 12);
        ctx.fillStyle = defense;
        ctx.fillRect(left + 84, height - 22, 12, 12);
        ctx.fillStyle = "#1c1c1a";
      ctx.fillText("Defense", left + 100, height - 12);
      canvas.style.cursor = "pointer";
    }
    }

    function cssAttr(value) {
      return String(value).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    }

    let watchTimer = null;
    let watching = null;
    let loadingList = false;

    function watchPlay(uid) {
      watching = uid;
      if (watchTimer === null) watchTimer = setInterval(tickPlay, 1000);
      tickPlay();
    }

    async function tickPlay() {
      if (!watching) return;
      const uid = watching;
      const response = await fetch(`/api/plays/${encodeURIComponent(uid)}/diagram`);
      if (!response.ok || watching !== uid) return;
      const payload = await response.json();
      const row = body.querySelector(`tr.play[data-uid="${cssAttr(uid)}"]`);
      if (row && payload.steps) {
        setBar(row.children[3], payload.steps.type || 0);
        setBar(row.children[4], payload.steps.players || 0);
        setBar(row.children[5], payload.steps.plot || 0);
        const button = row.querySelector("button");
        button.textContent = payload.running ? "Reading" : "Run";
        button.disabled = Boolean(payload.running);
        row.dataset.running = payload.running ? "1" : "";
      }
      const detail = body.querySelector(`tr.detail[data-uid="${cssAttr(uid)}"]`);
      if (detail && openUid === uid) showPlay(detail, payload);
      if (payload.running) return;
      clearInterval(watchTimer);
      watchTimer = null;
      watching = null;
      load();
    }

    async function load() {
      if (loadingList) return;
      loadingList = true;
      try {
        const response = await fetch("/api/analyze");
        if (!response.ok) return;
        const rows = await response.json();
        paint(rows);
      } finally {
        loadingList = false;
      }
    }

    load();
  </script>
</body>
</html>
